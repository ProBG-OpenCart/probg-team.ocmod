name: Validate ProBG Team

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    name: PHP ${{ matrix.php }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate source and committed dist
        run: bash tools/validate.sh

  compatibility:
    name: OpenCart ${{ matrix.opencart }} compatibility
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: opencart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        opencart: ['3.0.2.0', '3.0.3.7', '3.0.3.8', '3.0.3.9']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - name: Download clean OpenCart source
        id: opencart
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ matrix.opencart }}"
          ARCHIVE="/tmp/opencart-${VERSION}.tar.gz"
          EXTRACT="/tmp/opencart-${VERSION}"
          curl -fL --retry 4 --retry-all-errors \
            "https://github.com/opencart/opencart/archive/refs/tags/${VERSION}.tar.gz" \
            -o "$ARCHIVE"
          mkdir -p "$EXTRACT"
          tar -xzf "$ARCHIVE" -C "$EXTRACT"
          ROOT="$(find "$EXTRACT" -mindepth 2 -maxdepth 2 -type d -name upload -print -quit)"
          test -n "$ROOT"
          test -f "$ROOT/index.php"
          test -f "$ROOT/admin/index.php"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Validate OCMOD anchors and package overlay
        run: |
          python3 tools/check-opencart-compatibility.py \
            --opencart-root "${{ steps.opencart.outputs.root }}" \
            --version "${{ matrix.opencart }}"
      - name: Run install, upgrade and uninstall database smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.opencart.outputs.root }}"
          cp -a upload/. "$ROOT/"
          php tests/runtime/install_model_smoke.php \
            "$ROOT" 127.0.0.1 root root opencart 3306

  http-runtime:
    name: OpenCart ${{ matrix.opencart }} storefront HTTP
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: opencart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        opencart: ['3.0.2.0', '3.0.3.9']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP 7.4 storefront runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli,gd,curl,zip
          coverage: none
      - name: Download clean OpenCart source
        id: opencart
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ matrix.opencart }}"
          ARCHIVE="/tmp/opencart-http-${VERSION}.tar.gz"
          EXTRACT="/tmp/opencart-http-${VERSION}"
          curl -fL --retry 4 --retry-all-errors \
            "https://github.com/opencart/opencart/archive/refs/tags/${VERSION}.tar.gz" \
            -o "$ARCHIVE"
          mkdir -p "$EXTRACT"
          tar -xzf "$ARCHIVE" -C "$EXTRACT"
          ROOT="$(find "$EXTRACT" -mindepth 2 -maxdepth 2 -type d -name upload -print -quit)"
          test -n "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Install OpenCart and seed Team fixture
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.opencart.outputs.root }}"
          cp -a upload/. "$ROOT/"
          touch "$ROOT/config.php" "$ROOT/admin/config.php"
          php "$ROOT/install/cli_install.php" install \
            --db_hostname 127.0.0.1 \
            --db_username root \
            --db_password root \
            --db_database opencart \
            --db_driver mysqli \
            --db_port 3306 \
            --db_prefix oc_ \
            --username admin \
            --password admin \
            --email runtime@example.com \
            --http_server http://127.0.0.1:8080/
          php tests/runtime/prepare_http_fixture.php \
            "$ROOT" 127.0.0.1 root root opencart 3306 http://127.0.0.1:8080/ \
            | tee /tmp/probg-team-fixture.env
          cat /tmp/probg-team-fixture.env >> "$GITHUB_OUTPUT"
      - name: Exercise real storefront routes
        shell: bash
        run: |
          bash tests/runtime/http_storefront_smoke.sh \
            "${{ steps.opencart.outputs.root }}" \
            "${{ steps.fixture.outputs.CATEGORY_ID }}" \
            "${{ steps.fixture.outputs.MEMBER_ID }}"

  package:
    name: Reproducible package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Read module version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          print((ET.parse('install.xml').getroot().findtext('version') or '').strip())
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build package twice and verify deterministic output
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build-dist.sh "${{ steps.version.outputs.version }}"
          FIRST="$(sha256sum "dist/probg-team-${{ steps.version.outputs.version }}.ocmod.zip" | awk '{print $1}')"
          bash tools/build-dist.sh "${{ steps.version.outputs.version }}"
          SECOND="$(sha256sum "dist/probg-team-${{ steps.version.outputs.version }}.ocmod.zip" | awk '{print $1}')"
          test "$FIRST" = "$SECOND"
          echo "Deterministic SHA-256: $SECOND"
      - name: Upload validation package
        uses: actions/upload-artifact@v4
        with:
          name: probg-team-${{ steps.version.outputs.version }}-validation
          path: |
            dist/probg-team-${{ steps.version.outputs.version }}.ocmod.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
