name: ProBG Team beta.2 migration

on:
  push:
    branches:
      - feat/blog-architecture-beta2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .team-migrate/parts/* | base64 --decode > /tmp/team-big-six.tar.xz
          echo '95ab755e2c5602f7e6248022023f72ee10ac41541b6e10cb1d87c7315b4047ae  /tmp/team-big-six.tar.xz' | sha256sum -c -
          tar -xJf /tmp/team-big-six.tar.xz -C .

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          find upload -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('install.xml')
          print('install.xml OK')
          PY

      - name: Rebuild canonical dist package
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/probg-team-1.0.0-beta.ocmod.zip dist/probg-team-1.0.0-beta.2.ocmod.zip dist/SHA256SUMS
          zip -qr dist/probg-team-1.0.0-beta.2.ocmod.zip install.xml upload
          unzip -t dist/probg-team-1.0.0-beta.2.ocmod.zip >/tmp/unzip-test.log
          (cd dist && sha256sum probg-team-1.0.0-beta.2.ocmod.zip > SHA256SUMS)

      - name: Remove migration payload and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .team-migrate
          rm -f .github/workflows/team-beta2-migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: complete Blog-aligned Team architecture'
          git push origin HEAD:feat/blog-architecture-beta2
